[package]
name = "factory-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic native simulation core for HexFactory"
repository = "https://github.com/Sidem/HexFactory"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
